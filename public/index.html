
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dilBrowser</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:white;height:100vh;overflow:hidden;background:radial-gradient(ellipse at 20% 20%,#3478db 0%,transparent 45%),radial-gradient(ellipse at 80% 80%,#673ab7 0%,transparent 45%),linear-gradient(135deg,#07162f,#101a40 55%,#030817)}
.desktop{height:calc(100vh - 52px);padding:28px;display:flex;flex-direction:column;align-items:flex-start;gap:24px}
.desktop-icon{width:100px;text-align:center;cursor:pointer;padding:10px;border-radius:8px;font-size:13px;text-shadow:0 2px 5px #000}
.desktop-icon:hover{background:#ffffff20}
.desktop-icon .symbol{font-size:36px;display:block;margin-bottom:8px}
.taskbar{position:absolute;bottom:0;width:100%;height:52px;background:#10182dcc;backdrop-filter:blur(25px);border-top:1px solid #ffffff25;display:flex;align-items:center;justify-content:center;gap:9px}
.taskbutton{border:0;background:transparent;color:white;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:19px}
.taskbutton:hover{background:#ffffff22}
.clock{position:absolute;right:18px;font-size:12px;text-align:right;line-height:1.5}
.window{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:min(1000px,94vw);height:min(650px,78vh);min-height:300px;background:#17233aee;border:1px solid #ffffff40;border-radius:12px;overflow:hidden;box-shadow:0 25px 100px #0008;display:flex;flex-direction:column}
.window.hidden{display:none}
.titlebar{height:48px;display:flex;align-items:center;padding:0 12px;background:#202d43;gap:10px;flex-shrink:0;cursor:move}
.title{flex:1;font-size:14px}
.winbtn{border:0;color:white;background:transparent;padding:10px 13px;cursor:pointer;border-radius:5px}
.winbtn:hover{background:#ffffff25}
.winbtn.close:hover{background:#d83b42}
.toolbar{display:flex;gap:7px;padding:10px;background:#18243a;align-items:center}
.toolbar button{border:0;border-radius:7px;background:#ffffff16;color:white;padding:9px 12px;cursor:pointer}
.toolbar button:hover{background:#ffffff2b}
#address{min-width:0;flex:1;padding:10px 14px;border:1px solid #ffffff25;background:#0c1529;color:white;border-radius:20px;outline:none}
#address:focus{border-color:#63a9ff}
.page{flex:1;position:relative;background:#f4f6fb;color:#17233a;overflow:auto}
.home{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center;background:radial-gradient(ellipse at top,#dbeafe,#f8fafc 65%)}
.logo{font-size:46px;font-weight:650;letter-spacing:-2px;color:#1d4ed8}
.subtitle{color:#64748b;margin:10px 0 25px}
.search{display:flex;gap:8px;width:min(600px,100%)}
.search input{flex:1;min-width:0;padding:14px 18px;border:1px solid #cbd5e1;border-radius:24px;font-size:15px;outline:none}
.search button{border:0;background:#2563eb;color:white;border-radius:22px;padding:0 22px;cursor:pointer}
.links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:24px}
.links button{border:1px solid #dbe2ef;background:white;color:#334155;padding:12px 15px;border-radius:12px;cursor:pointer}
.links button:hover{background:#e8efff}
#viewer{width:100%;height:100%;border:0;background:white}
.startmenu{position:absolute;bottom:62px;left:50%;transform:translateX(-50%);width:min(420px,94vw);padding:22px;border:1px solid #ffffff35;border-radius:16px;background:#18243aee;backdrop-filter:blur(25px);box-shadow:0 20px 70px #0007}
.startmenu.hidden{display:none}
.startmenu h3{margin:0 0 14px}
.startgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.startgrid button{border:0;background:#ffffff10;color:white;border-radius:10px;padding:15px 5px;cursor:pointer}
.startgrid button:hover{background:#ffffff25}
@media(max-width:600px){.desktop{padding:12px}.window{height:78vh}.titlebar{height:42px}.toolbar{gap:4px;padding:6px}.toolbar button{padding:9px 8px}.clock{display:none}.logo{font-size:36px}}
</style>
</head>
<body>
<div class="desktop">
  <div class="desktop-icon" onclick="showBrowser()"><span class="symbol">🌐</span>dilBrowser</div>
  <div class="desktop-icon" onclick="about()"><span class="symbol">ℹ️</span>About dilBrowser</div>
</div>

<div class="window" id="window">
  <div class="titlebar" id="titlebar">
    <span>🌐</span><span class="title">dilBrowser</span>
    <button class="winbtn" onclick="minimize()">—</button>
    <button class="winbtn" onclick="maximize()">□</button>
    <button class="winbtn close" onclick="closeBrowser()">✕</button>
  </div>
  <div class="toolbar">
    <button onclick="goBack()" title="Back">←</button>
    <button onclick="goForward()" title="Forward">→</button>
    <button onclick="reloadPage()" title="Reload">↻</button>
    <button onclick="goHome()" title="Home">⌂</button>
    <input id="address" placeholder="Search or enter a website address" onkeydown="if(event.key==='Enter')navigate(this.value)">
    <button onclick="navigate(document.getElementById('address').value)">Go</button>
  </div>
  <div class="page" id="page">
    <div class="home" id="home">
      <div class="logo">dilBrowser</div>
      <div class="subtitle">Your own little corner of the internet.</div>
      <div class="search"><input id="homesearch" placeholder="Search or enter a website..." onkeydown="if(event.key==='Enter')navigate(this.value)"><button onclick="navigate(document.getElementById('homesearch').value)">Search</button></div>
      <div class="links">
        <button onclick="navigate('https://www.wikipedia.org')">📚 Wikipedia</button>
        <button onclick="navigate('https://www.example.com')">🌐 Example</button>
        <button onclick="navigate('https://developer.mozilla.org')">💻 MDN Docs</button>
      </div>
      <p style="margin-top:35px;color:#94a3b8;font-size:12px">A web desktop experiment</p>
    </div>
    <iframe id="viewer" title="Website viewer" hidden referrerpolicy="no-referrer"></iframe>
  </div>
</div>

<div class="startmenu hidden" id="startmenu">
  <h3>Start</h3>
  <div class="startgrid">
    <button onclick="goHome();hideStart()">🏠<br>Home</button>
    <button onclick="navigate('https://www.wikipedia.org');hideStart()">📚<br>Wikipedia</button>
    <button onclick="navigate('https://developer.mozilla.org');hideStart()">💻<br>Developer</button>
    <button onclick="navigate('https://www.example.com');hideStart()">🌐<br>Example</button>
    <button onclick="about();hideStart()">ℹ️<br>About</button>
    <button onclick="showBrowser();hideStart()">🪟<br>Browser</button>
  </div>
</div>

<div class="taskbar">
  <button class="taskbutton" onclick="toggleStart()" title="Start">⊞</button>
  <button class="taskbutton" onclick="showBrowser()" title="dilBrowser">🌐</button>
  <button class="taskbutton" onclick="goHome()" title="Home">⌂</button>
  <div class="clock" id="clock"></div>
</div>

<script>
const win=document.getElementById('window');
const home=document.getElementById('home');
const viewer=document.getElementById('viewer');
const address=document.getElementById('address');
let historyList=[];
let historyIndex=-1;
let maximized=false;
let previousStyle={};

function normalizeUrl(value){
  value=value.trim();
  if(!value)return '';
  if(/\s/.test(value)||!value.includes('.')){
    return 'https://www.google.com/search?q='+encodeURIComponent(value);
  }
  if(!/^https?:\/\//i.test(value))value='https://'+value;
  return value;
}
function navigate(value,addHistory=true){
  const url=normalizeUrl(value);
  if(!url)return;
  if(addHistory){
    historyList=historyList.slice(0,historyIndex+1);
    historyList.push(url);
    historyIndex=historyList.length-1;
  }
  address.value=url;
  document.getElementById('homesearch').value=value;
  home.hidden=true;
  viewer.hidden=false;
  viewer.src=url;
  showBrowser();
}
function goBack(){
  if(historyIndex>0){historyIndex--;navigate(historyList[historyIndex],false);}
}
function goForward(){
  if(historyIndex<historyList.length-1){historyIndex++;navigate(historyList[historyIndex],false);}
}
function reloadPage(){
  if(!viewer.hidden&&viewer.src) viewer.src=viewer.src;
  else goHome();
}
function goHome(){
  address.value='';
  viewer.hidden=true;
  viewer.src='about:blank';
  home.hidden=false;
  showBrowser();
}
function showBrowser(){win.classList.remove('hidden')}
function closeBrowser(){win.classList.add('hidden')}
function minimize(){win.classList.add('hidden')}
function maximize(){
  if(!maximized){
    previousStyle={left:win.style.left,top:win.style.top,width:win.style.width,height:win.style.height,transform:win.style.transform,borderRadius:win.style.borderRadius};
    win.style.left='0';win.style.top='0';win.style.width='100vw';win.style.height='calc(100vh - 52px)';win.style.transform='none';win.style.borderRadius='0';maximized=true;
  }else{
    Object.assign(win.style,previousStyle);maximized=false;
  }
}
function toggleStart(){document.getElementById('startmenu').classList.toggle('hidden')}
function hideStart(){document.getElementById('startmenu').classList.add('hidden')}
function about(){alert('dilBrowser\\nA Windows-inspired desktop and browser demo. Some websites block embedding, so they may not load inside the window.')}
function updateClock(){
  const now=new Date();
  document.getElementById('clock').innerHTML=now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'<br>'+now.toLocaleDateString();
}
updateClock();setInterval(updateClock,1000);

const titlebar=document.getElementById('titlebar');
let dragging=false,offsetX=0,offsetY=0;
titlebar.addEventListener('pointerdown',e=>{
  if(e.target.closest('button')||maximized)return;
  dragging=true;
  const rect=win.getBoundingClientRect();
  offsetX=e.clientX-rect.left;
  offsetY=e.clientY-rect.top;
  titlebar.setPointerCapture(e.pointerId);
});
titlebar.addEventListener('pointermove',e=>{
  if(!dragging)return;
  win.style.left=(e.clientX-offsetX)+'px';
  win.style.top=(e.clientY-offsetY)+'px';
  win.style.transform='none';
});
titlebar.addEventListener('pointerup',()=>dragging=false);
titlebar.addEventListener('pointercancel',()=>dragging=false);
</script>
</body>
</html>
