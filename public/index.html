
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dilBrowser</title>
<style>
:root{
  --accent:#7168f5;
  --ink:#25263a;
  --muted:#81869c;
  --glass:rgba(255,255,255,.82);
  --line:rgba(95,101,145,.14);
  --shadow:0 22px 70px rgba(44,43,90,.18);
}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#f6f7ff}
button,input{font:inherit}
button{cursor:pointer}
.desktop{
  position:fixed;inset:0;overflow:hidden;
  background:linear-gradient(135deg,#f7f8ff,#eef3ff 48%,#fff4fa);
}
.orb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;opacity:.62;animation:float 18s ease-in-out infinite alternate}
.orb.one{width:380px;height:380px;background:#c5d5ff;left:8%;top:7%}
.orb.two{width:420px;height:420px;background:#ffd9ec;right:4%;top:15%;animation-delay:-7s}
.orb.three{width:300px;height:300px;background:#c7f2ed;left:36%;bottom:5%;animation-delay:-11s}
@keyframes float{to{transform:translate(45px,35px) scale(1.13)}}
.desktop-label{
  position:absolute;top:22px;left:25px;font-size:12px;font-weight:700;
  letter-spacing:2px;color:#777d9a;text-transform:uppercase;z-index:1
}
.desktop-icons{
  position:absolute;z-index:2;top:52px;left:14px;right:14px;bottom:75px;
  display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,min-content);
  grid-template-columns:repeat(auto-fill,88px);align-content:start;gap:7px;
}
.desktop-icon{
  border:1px solid transparent;background:transparent;border-radius:17px;
  width:82px;min-height:88px;padding:8px 3px;display:flex;flex-direction:column;
  align-items:center;gap:7px;color:#33364d;user-select:none;
  transition:background .18s,border .18s,transform .18s;
}
.desktop-icon:hover{background:rgba(255,255,255,.65);border-color:#ffffff}
.desktop-icon.selected{background:rgba(113,104,245,.14);border-color:#bdb9ff}
.desktop-icon:active{transform:scale(.96)}
.app-icon{
  width:47px;height:47px;border-radius:15px;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:24px;font-weight:800;
  box-shadow:0 8px 18px rgba(45,48,90,.14);flex-shrink:0;
}
.desktop-icon>span:last-child{font-size:11px;max-width:80px;text-align:center;line-height:1.25;overflow-wrap:anywhere;text-shadow:0 1px 3px #fff}
.i-browser{background:linear-gradient(145deg,#7eb6ff,#5968e8)}
.i-game{background:linear-gradient(145deg,#a8e56e,#35a46c)}
.i-youtube{background:#ff1744}
.i-google{background:#fff;color:#4285f4;border:1px solid #e6e8f0}
.i-discord{background:#5865f2}
.i-settings{background:linear-gradient(145deg,#aeb8cb,#69758d)}
.i-tiktok{background:#171717}
.i-spotify{background:#1ed760;color:#153c23}
.i-soundcloud{background:linear-gradient(145deg,#ffbc55,#ff651e)}
.i-wiki{background:#fff;color:#343746;border:1px solid #e0e3ec}
.i-minecraft{background:linear-gradient(145deg,#69c76c,#36864b)}
.i-poki{background:linear-gradient(145deg,#ffbc58,#ff7559)}
.i-crazy{background:linear-gradient(145deg,#ff745e,#ee3e62)}
.i-cookie{background:linear-gradient(145deg,#e4a46c,#a96336)}
.i-tetris{background:linear-gradient(145deg,#7d7aff,#5145d9)}
.i-2048{background:linear-gradient(145deg,#f2c66d,#e29c3c)}
.i-scratch{background:linear-gradient(145deg,#ffbd44,#ff8a26)}
.i-reddit{background:#ff5722}
.i-twitch{background:#9146ff}
.i-github{background:#292a35}
.i-classroom{background:#42a66c}
.i-drive{background:#fff;color:#38a56b;border:1px solid #e2e6ed}
.i-chatgpt{background:#172b2a}
.i-proxy{background:linear-gradient(145deg,#46d6d0,#4286ed)}
.i-roblox{background:#fff;color:#252638;border:1px solid #e2e5ed}
.i-pinterest{background:#e60023}
.i-khan{background:#19a879}
.i-weather{background:linear-gradient(145deg,#7ec7ff,#4e8de9)}
.i-clock{background:linear-gradient(145deg,#a9b6cb,#65728c)}

.window{
  position:absolute;z-index:5;top:9%;left:15%;width:min(920px,80vw);
  height:min(620px,80vh);min-width:290px;min-height:240px;
  border:1px solid rgba(255,255,255,.95);border-radius:21px;
  background:rgba(255,255,255,.91);backdrop-filter:blur(24px);
  box-shadow:var(--shadow);overflow:hidden;display:none;flex-direction:column;
  animation:pop .2s ease-out;
}
.window.active{display:flex}
@keyframes pop{from{opacity:0;transform:translateY(9px) scale(.985)}to{opacity:1;transform:none}}
.window.maximized{top:8px!important;left:8px!important;width:calc(100vw - 16px)!important;height:calc(100vh - 72px)!important}
.titlebar{height:48px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 13px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.75);cursor:grab;user-select:none}
.titlebar:active{cursor:grabbing}
.window-app-icon{width:27px;height:27px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.window-title{font-size:13px;font-weight:700;flex:1}
.window-actions{display:flex;gap:7px}
.win-btn{border:0;background:#f0f1f8;color:#596078;width:27px;height:27px;border-radius:9px}
.win-btn:hover{background:#e1e5f5}
.win-btn.close:hover{background:#ffe1e6;color:#d22e4c}
.toolbar{display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid var(--line);background:rgba(249,250,255,.93)}
.tool-btn{border:1px solid var(--line);background:#fff;color:#555d76;border-radius:10px;padding:7px 10px}
.tool-btn:hover{background:#f0f2ff}
.address{flex:1;min-width:0;padding:9px 12px;border:1px solid #e3e6f0;background:#f7f8fc;border-radius:11px;outline:none;color:#3b4057}
.address:focus{border-color:#a9a2ff;background:#fff}
.go-btn{border:0;border-radius:10px;background:var(--accent);color:white;padding:9px 14px;font-weight:700}
.go-btn:hover{filter:brightness(.94)}
.browser-content{flex:1;min-height:0;position:relative}
.home-screen{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px;background:radial-gradient(ellipse at center,rgba(228,233,255,.7),transparent 65%)}
.brand-mark{width:72px;height:72px;border-radius:25px;background:linear-gradient(145deg,#a5a0ff,#6862e9);box-shadow:0 14px 28px #8179ef40;color:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;margin-bottom:16px}
.home-screen h1{margin:0;font-size:clamp(27px,4vw,39px);letter-spacing:-1.5px}
.home-screen p{color:var(--muted);font-size:14px;margin:10px 0 23px}
.home-search{display:flex;gap:8px;width:min(510px,100%)}
.home-search input{flex:1;min-width:0;border:1px solid #e0e4f0;background:#fff;border-radius:14px;padding:14px;outline:none;box-shadow:0 6px 20px #343d700b}
.home-search input:focus{border-color:#a6a0ff}
.home-apps{display:grid;grid-template-columns:repeat(5,70px);justify-content:center;gap:8px;margin-top:25px}
.home-app{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid transparent;background:transparent;border-radius:13px;padding:8px 2px;color:#6c7186;font-size:10px}
.home-app:hover{background:#ffffffad;border-color:#fff}
.home-app .app-icon{width:36px;height:36px;border-radius:12px;font-size:19px}
.viewer{position:absolute;inset:0;background:#fff}
.viewer iframe{width:100%;height:100%;border:0;background:#fff}
.settings-content{flex:1;overflow:auto;padding:22px;background:#f7f8ff}
.settings-content h2{margin:0 0 5px;font-size:24px}
.sub{font-size:13px;color:var(--muted);margin:0 0 20px}
.settings-group{background:white;border:1px solid #e8eaf3;border-radius:16px;padding:16px;margin-bottom:12px}
.settings-group h3{font-size:14px;margin:0 0 10px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.setting-row+.setting-row{border-top:1px solid #edf0f6}
.setting-row strong{display:block;font-size:13px}
.setting-row small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.setting-row input{width:18px;height:18px;accent-color:var(--accent)}
.fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:25px;text-align:center;background:#f4f5ff}
.fallback.show{display:flex}
.fallback-card{max-width:420px;background:#fff;border:1px solid white;border-radius:22px;padding:27px;box-shadow:0 12px 40px #34365b16}
.fallback-card h2{margin:13px 0 8px}
.fallback-card p{font-size:13px;line-height:1.6;color:var(--muted)}
.fallback-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.taskbar{position:absolute;z-index:100;bottom:0;left:0;right:0;height:57px;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(255,255,255,.78);backdrop-filter:blur(26px);border-top:1px solid #fff;box-shadow:0 -6px 24px #3b43750b}
.start-btn{width:39px;height:39px;border:0;border-radius:13px;background:linear-gradient(145deg,#aaa4ff,#6862e9);color:white;font-weight:900;font-size:20px}
.start-btn:hover{transform:translateY(-1px)}
.task-apps{display:flex;align-items:center;gap:5px;flex:1;min-width:0;overflow-x:auto}
.task-app{position:relative;width:36px;height:36px;flex-shrink:0;border:0;border-radius:11px;background:transparent;font-size:20px}
.task-app:hover,.task-app.running{background:#7168f51c}
.task-app.running:after{content:"";position:absolute;bottom:2px;left:11px;width:14px;height:3px;border-radius:3px;background:var(--accent)}
.clock{text-align:right;color:#737991;font-size:11px;line-height:1.5;white-space:nowrap}
.start-menu{display:none;position:absolute;z-index:110;bottom:65px;left:13px;width:min(390px,calc(100vw - 26px));max-height:78vh;overflow:auto;padding:17px;background:#ffffffed;backdrop-filter:blur(25px);border:1px solid white;border-radius:21px;box-shadow:var(--shadow);animation:pop .18s ease-out}
.start-menu.show{display:block}
.start-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.start-head .brand-mark{width:42px;height:42px;border-radius:14px;font-size:23px;margin:0}
.start-head strong{font-size:15px}
.start-head small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.start-search{width:100%;padding:11px 13px;border:1px solid #e1e5f0;border-radius:11px;outline:none;margin-bottom:14px}
.start-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.start-item{display:flex;flex-direction:column;align-items:center;gap:7px;padding:11px 3px;background:transparent;border:1px solid transparent;border-radius:13px;color:#4b5067;font-size:10px}
.start-item:hover{background:#f0f1ff;border-color:#e6e4ff}
.start-item .app-icon{width:37px;height:37px;border-radius:12px;font-size:20px}
.start-foot{margin-top:13px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
@media(max-width:600px){
 .desktop-icons{grid-template-rows:repeat(8,min-content);grid-template-columns:repeat(auto-fill,75px);gap:4px}
 .desktop-icon{width:72px}
 .window{left:3%;top:5%;width:94vw;height:84vh;min-width:0}
 .toolbar{gap:5px;padding:7px}.tool-btn{padding:7px 8px}.go-btn{padding:8px 10px}
 .home-apps{grid-template-columns:repeat(4,65px)}
 .taskbar{padding:0 8px;gap:6px}
}
</style>
</head>
<body>
<div class="desktop">
  <div class="orb one"></div><div class="orb two"></div><div class="orb three"></div>
  <div class="desktop-label">dilBrowser · Desktop</div>
  <div class="desktop-icons" id="desktopIcons"></div>

  <section class="window" id="browserWindow">
    <div class="titlebar" data-drag>
      <span class="window-app-icon i-browser">d</span><span class="window-title">dilBrowser</span>
      <div class="window-actions">
        <button class="win-btn" onclick="minimizeWindow('browser')">−</button>
        <button class="win-btn" onclick="maximizeWindow('browser')">□</button>
        <button class="win-btn close" onclick="closeWindow('browser')">×</button>
      </div>
    </div>
    <div class="toolbar">
      <button class="tool-btn" onclick="goBack()">←</button>
      <button class="tool-btn" onclick="goForward()">→</button>
      <button class="tool-btn" onclick="reloadBrowser()">↻</button>
      <button class="tool-btn" onclick="goHome()">⌂</button>
      <input class="address" id="address" placeholder="Search or enter a website">
      <button class="go-btn" onclick="openAddress()">Go</button>
    </div>
    <div class="browser-content">
      <div class="home-screen" id="homeScreen">
        <div class="brand-mark">d</div>
        <h1>Good to see you.</h1>
        <p>A little space for everything you do online.</p>
        <div class="home-search">
          <input id="homeAddress" placeholder="Search the web or enter a URL" onkeydown="if(event.key==='Enter')openHomeAddress()">
          <button class="go-btn" onclick="openHomeAddress()">Search</button>
        </div>
        <div class="home-apps" id="homeApps"></div>
      </div>
      <div class="viewer" id="browserViewer" style="display:none"><iframe id="browserFrame" title="Browser view" referrerpolicy="no-referrer"></iframe></div>
    </div>
  </section>

  <div id="appWindows"></div>

  <div class="start-menu" id="startMenu">
    <div class="start-head"><div class="brand-mark">d</div><div><strong>dilBrowser</strong><small>Everything in one place</small></div></div>
    <input class="start-search" id="startSearch" placeholder="Search apps..." oninput="filterStartApps(this.value)">
    <div class="start-grid" id="startGrid"></div>
    <div class="start-foot"><span>All apps</span><span>Web desktop</span></div>
  </div>

  <div class="taskbar">
    <button class="start-btn" onclick="toggleStartMenu()">d</button>
    <div class="task-apps" id="taskApps"></div>
    <div class="clock"><div id="clockTime"></div><div id="clockDate"></div></div>
  </div>
</div>

<script>
const APPS={
 browser:{name:"Browser",icon:"d",cls:"i-browser",builtIn:true},
 game:{name:"Geometry Dash",icon:"🎮",cls:"i-game",url:"https://truffled.lol/games/geo/index.html"},
 youtube:{name:"YouTube",icon:"▶",cls:"i-youtube",url:"https://www.youtube.com/"},
 google:{name:"Google",icon:"G",cls:"i-google",url:"https://www.google.com/"},
 discord:{name:"Discord",icon:"◕",cls:"i-discord",url:"https://discord.com/app"},
 settings:{name:"Settings",icon:"⚙",cls:"i-settings",builtIn:true},
 tiktok:{name:"TikTok",icon:"♪",cls:"i-tiktok",url:"https://www.tiktok.com/"},
 spotify:{name:"Spotify",icon:"●",cls:"i-spotify",url:"https://open.spotify.com/"},
 soundcloud:{name:"SoundCloud",icon:"☁",cls:"i-soundcloud",url:"https://soundcloud.com/"},
 wikipedia:{name:"Wikipedia",icon:"W",cls:"i-wiki",url:"https://www.wikipedia.org/"},
 minecraft:{name:"Minecraft",icon:"⛏",cls:"i-minecraft",url:"https://classic.minecraft.net/"},
 poki:{name:"Poki Games",icon:"P",cls:"i-poki",url:"https://poki.com/"},
 crazygames:{name:"CrazyGames",icon:"C",cls:"i-crazy",url:"https://www.crazygames.com/"},
 cookie:{name:"Cookie Clicker",icon:"🍪",cls:"i-cookie",url:"https://orteil.dashnet.org/cookieclicker/"},
 tetris:{name:"Tetris",icon:"▦",cls:"i-tetris",url:"https://tetris.com/play-tetris"},
 game2048:{name:"2048",icon:"2048",cls:"i-2048",url:"https://play2048.co/"},
 scratch:{name:"Scratch",icon:"🐱",cls:"i-scratch",url:"https://scratch.mit.edu/"},
 reddit:{name:"Reddit",icon:"●",cls:"i-reddit",url:"https://www.reddit.com/"},
 twitch:{name:"Twitch",icon:"▣",cls:"i-twitch",url:"https://www.twitch.tv/"},
 github:{name:"GitHub",icon:"⌘",cls:"i-github",url:"https://github.com/"},
 classroom:{name:"Classroom",icon:"▰",cls:"i-classroom",url:"https://classroom.google.com/"},
 drive:{name:"Google Drive",icon:"▲",cls:"i-drive",url:"https://drive.google.com/"},
 chatgpt:{name:"ChatGPT",icon:"✳",cls:"i-chatgpt",url:"https://chatgpt.com/"},
 proxy:{name:"Web Search",icon:"⌕",cls:"i-proxy",url:"https://www.google.com/"},
 roblox:{name:"Roblox",icon:"◇",cls:"i-roblox",url:"https://www.roblox.com/"},
 pinterest:{name:"Pinterest",icon:"P",cls:"i-pinterest",url:"https://www.pinterest.com/"},
 khan:{name:"Khan Academy",icon:"K",cls:"i-khan",url:"https://www.khanacademy.org/"},
 weather:{name:"Weather",icon:"☀",cls:"i-weather",url:"https://weather.com/"},
 clock:{name:"Clock",icon:"◷",cls:"i-clock",builtIn:true}
};
const $=id=>document.getElementById(id);
const desktopIcons=$("desktopIcons"),appWindows=$("appWindows"),startGrid=$("startGrid"),taskApps=$("taskApps");
const browserWindow=$("browserWindow"),browserFrame=$("browserFrame");
let z=10,active=null,historyList=[],historyIndex=-1;
const windows={};

function icon(app){return `<span class="app-icon ${app.cls}">${app.icon}</span>`}
function buildIcons(){
 desktopIcons.innerHTML="";
 Object.entries(APPS).filter(([id])=>id!=="browser").forEach(([id,a])=>{
  const b=document.createElement("button");b.className="desktop-icon";b.dataset.app=id;
  b.innerHTML=icon(a)+`<span>${a.name}</span>`;
  b.addEventListener("click",()=>{desktopIcons.querySelectorAll(".desktop-icon").forEach(x=>x.classList.remove("selected"));b.classList.add("selected")});
  b.addEventListener("dblclick",()=>launchApp(id));
  desktopIcons.appendChild(b);
 });
}
function buildStart(){
 startGrid.innerHTML="";
 Object.entries(APPS).forEach(([id,a])=>{
  const b=document.createElement("button");b.className="start-item";b.dataset.app=id;
  b.innerHTML=icon(a)+`<span>${a.name}</span>`;b.onclick=()=>launchApp(id);startGrid.appendChild(b);
 });
 const homeApps=$("homeApps");
 ["youtube","google","game","poki","chatgpt","discord","spotify","settings","minecraft","cookie"].forEach(id=>{
  const a=APPS[id],b=document.createElement("button");b.className="home-app";
  b.innerHTML=icon(a)+`<span>${a.name}</span>`;b.onclick=()=>launchApp(id);homeApps.appendChild(b);
 });
 taskApps.innerHTML="";
 ["browser","game","youtube","google","discord","settings","poki","chatgpt","spotify"].forEach(id=>{
  const a=APPS[id],b=document.createElement("button");b.className="task-app";b.title=a.name;b.textContent=a.icon;b.dataset.task=id;
  b.onclick=()=>{if(id==="browser")showWindow(browserWindow,id);else if(windows[id]?.classList.contains("active"))minimizeWindow(id);else launchApp(id)};
  taskApps.appendChild(b);
 });
}
buildIcons();buildStart();

function toggleStartMenu(){$("startMenu").classList.toggle("show");if($("startMenu").classList.contains("show"))$("startSearch").focus()}
function filterStartApps(q){
 q=q.toLowerCase().trim();let n=0;
 [...startGrid.children].forEach(b=>{b.style.display=b.textContent.toLowerCase().includes(q)?"":"none";if(b.style.display!=="none")n++});
 let e=startGrid.querySelector(".empty-results");
 if(!n&&!e){e=document.createElement("div");e.className="empty-results";e.textContent="No apps found";startGrid.appendChild(e)}
 if(n&&e)e.remove();
}
function taskState(id,on){const b=taskApps.querySelector(`[data-task="${id}"]`);if(b)b.classList.toggle("running",on)}
function showWindow(win,id){win.classList.add("active");win.style.zIndex=++z;active=id;taskState(id,true);$("startMenu").classList.remove("show")}
function closeWindow(id){
 const w=id==="browser"?browserWindow:windows[id];if(w)w.classList.remove("active");
 taskState(id,false);if(active===id)active=null;
}
function minimizeWindow(id){const w=id==="browser"?browserWindow:windows[id];if(w)w.classList.remove("active");if(active===id)active=null}
function maximizeWindow(id){const w=id==="browser"?browserWindow:windows[id];if(w){w.classList.toggle("maximized");w.style.zIndex=++z}}
function dragWindow(win,id){
 const bar=win.querySelector("[data-drag]");let down=false,sx=0,sy=0,ox=0,oy=0;
 bar.addEventListener("pointerdown",e=>{
  if(e.target.closest("button")||win.classList.contains("maximized"))return;
  down=true;sx=e.clientX;sy=e.clientY;const r=win.getBoundingClientRect();ox=r.left;oy=r.top;
  bar.setPointerCapture(e.pointerId);win.style.zIndex=++z;active=id;
 });
 bar.addEventListener("pointermove",e=>{if(!down)return;
  win.style.left=Math.max(0,Math.min(innerWidth-win.offsetWidth,ox+e.clientX-sx))+"px";
  win.style.top=Math.max(0,Math.min(innerHeight-80,oy+e.clientY-sy))+"px";
 });
 bar.addEventListener("pointerup",()=>down=false);bar.addEventListener("pointercancel",()=>down=false);
}
function settingsHTML(){return `<div class="settings-content"><h2>Settings</h2><p class="sub">Make your desktop feel like yours.</p>
 <div class="settings-group"><h3>Appearance</h3>
 <div class="setting-row"><div><strong>Animated background</strong><small>Soft moving color effects.</small></div><input type="checkbox" checked onchange="toggleAnimation(this.checked)"></div>
 <div class="setting-row"><div><strong>Floating icons</strong><small>Subtle movement on desktop icons.</small></div><input type="checkbox" checked onchange="toggleIcons(this.checked)"></div>
 <div class="setting-row"><div><strong>Accent color</strong><small>Change the main interface color.</small></div><select onchange="document.documentElement.style.setProperty('--accent',this.value)"><option value="#7168f5">Purple</option><option value="#4285f4">Blue</option><option value="#19a879">Green</option><option value="#f05b91">Pink</option><option value="#f28a38">Orange</option></select></div>
 </div><div class="settings-group"><h3>Quick actions</h3>
 <div class="setting-row"><div><strong>Open browser home</strong><small>Return to the dilBrowser start page.</small></div><button class="tool-btn" onclick="goHome();showWindow(browserWindow,'browser')">Open</button></div>
 <div class="setting-row"><div><strong>Open all apps</strong><small>Find all available apps in Start.</small></div><button class="tool-btn" onclick="toggleStartMenu()">Start menu</button></div>
 </div><div class="settings-group"><h3>About</h3><div class="setting-row"><div><strong>dilBrowser</strong><small>A mini web desktop with internal app windows.</small></div><span style="font-size:12px;color:#777">Edition 2.0</span></div></div></div>`}
function makeWindow(id){
 const a=APPS[id],w=document.createElement("section");w.className="window";w.id="window-"+id;
 w.style.left=Math.max(12,Math.min(innerWidth-340,95+Object.keys(windows).length*24))+"px";
 w.style.top=Math.max(12,Math.min(innerHeight-270,65+Object.keys(windows).length*18))+"px";
 w.innerHTML=`<div class="titlebar" data-drag><span class="window-app-icon ${a.cls}">${a.icon}</span><span class="window-title">${a.name}</span><div class="window-actions"><button class="win-btn" onclick="minimizeWindow('${id}')">−</button><button class="win-btn" onclick="maximizeWindow('${id}')">□</button><button class="win-btn close" onclick="closeWindow('${id}')">×</button></div></div>`+
 (id==="settings"?settingsHTML():id==="clock"?`<div class="settings-content" style="display:flex;align-items:center;justify-content:center;flex-direction:column"><div style="font-size:clamp(48px,10vw,90px);font-weight:300;letter-spacing:-4px" id="bigClock">--:--</div><p id="bigDate" style="color:var(--muted)"></p></div>`:
 `<div class="toolbar"><button class="tool-btn" onclick="reloadApp('${id}')">↻</button><input class="address" id="addr-${id}" value="${a.url}" aria-label="App address"><button class="go-btn" onclick="navigateApp('${id}')">Go</button><button class="tool-btn" onclick="externalApp('${id}')" title="Open in new tab">↗</button></div><div class="browser-content"><div class="viewer"><iframe id="frame-${id}" src="${a.url}" title="${a.name}" referrerpolicy="no-referrer" allow="fullscreen; autoplay; clipboard-read; clipboard-write"></iframe></div><div class="fallback" id="fallback-${id}"><div class="fallback-card">${icon(a)}<h2>${a.name}</h2><p>This site may block embedded browsing. Try opening it in a separate browser tab.</p><div class="fallback-actions"><button class="go-btn" onclick="externalApp('${id}')">Open externally ↗</button><button class="tool-btn" onclick="reloadApp('${id}')">Try again</button></div></div></div></div>`);
 appWindows.appendChild(w);windows[id]=w;dragWindow(w,id);w.addEventListener("pointerdown",()=>{w.style.zIndex=++z;active=id});return w;
}
function launchApp(id){
 $("startMenu").classList.remove("show");
 if(id==="browser"){showWindow(browserWindow,id);return}
 if(!windows[id])makeWindow(id);
 showWindow(windows[id],id);
 if(id==="clock")updateClock();
}
function normalizeUrl(s){
 s=(s||"").trim();if(!s)return "https://www.google.com/";
 if(/^https?:\/\//i.test(s))return s;
 if(s.includes(".")&&!s.includes(" "))return "https://"+s;
 return "https://www.google.com/search?q="+encodeURIComponent(s);
}
function navigateApp(id){
 const a=$("addr-"+id);if(!a)return;const url=normalizeUrl(a.value);a.value=url;
 const f=$("frame-"+id);if(f)f.src=url;
 const fb=$("fallback-"+id);if(fb)fb.classList.remove("show");
}
function reloadApp(id){const f=$("frame-"+id);if(f)f.src=$("addr-"+id).value;const fb=$("fallback-"+id);if(fb)fb.classList.remove("show")}
function externalApp(id){const a=$("addr-"+id);window.open(a?normalizeUrl(a.value):APPS[id].url,"_blank","noopener,noreferrer")}
function openAddress(){navigateBrowser($("address").value)}
function openHomeAddress(){navigateBrowser($("homeAddress").value)}
function navigateBrowser(s){
 const url=normalizeUrl(s);$("address").value=url;$("homeAddress").value=s;
 historyList=historyList.slice(0,historyIndex+1);historyList.push(url);historyIndex=historyList.length-1;
 $("homeScreen").style.display="none";$("browserViewer").style.display="block";browserFrame.src=url;showWindow(browserWindow,"browser");
}
function goBack(){if(historyIndex>0){historyIndex--;loadHistory()}else goHome()}
function goForward(){if(historyIndex<historyList.length-1){historyIndex++;loadHistory()}}
function loadHistory(){const u=historyList[historyIndex];$("address").value=u;browserFrame.src=u;$("homeScreen").style.display="none";$("browserViewer").style.display="block"}
function reloadBrowser(){if(historyIndex>=0)browserFrame.src=historyList[historyIndex]}
function goHome(){$("homeScreen").style.display="flex";$("browserViewer").style.display="none";$("address").value="";browserFrame.src="about:blank"}
$("address").addEventListener("keydown",e=>{if(e.key==="Enter")openAddress()});
function toggleAnimation(on){document.querySelectorAll(".orb").forEach(o=>o.style.animationPlayState=on?"running":"paused")}
function toggleIcons(on){document.querySelectorAll(".desktop-icon").forEach((b,i)=>b.style.animation=on?`iconFloat 5s ease-in-out ${-i*.35}s infinite`:"none")}
document.addEventListener("click",e=>{if(!e.target.closest(".start-menu")&&!e.target.closest(".start-btn"))$("startMenu").classList.remove("show")});
desktopIcons.addEventListener("click",e=>{if(!e.target.closest(".desktop-icon"))desktopIcons.querySelectorAll(".desktop-icon").forEach(x=>x.classList.remove("selected"))});
function updateClock(){
 const d=new Date();$("clockTime").textContent=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
 $("clockDate").textContent=d.toLocaleDateString([],{month:"short",day:"numeric"});
 const bc=$("bigClock"),bd=$("bigDate");if(bc)bc.textContent=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit",second:"2-digit"});if(bd)bd.textContent=d.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric",year:"numeric"});
}
updateClock();setInterval(updateClock,1000);dragWindow(browserWindow,"browser");
</script>
