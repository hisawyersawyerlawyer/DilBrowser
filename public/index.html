
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dilBrowser</title>
<style>
:root {
  --glass: rgba(255,255,255,.82);
  --line: rgba(40,50,75,.13);
  --text: #202638;
  --muted: #788196;
  --blue: #5b8def;
  --shadow: 0 18px 55px rgba(43,57,88,.16);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  color: var(--text);
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg,#fff 0%,#f2f6ff 50%,#fff5f8 100%);
}
button, input { font: inherit; }
button { cursor: pointer; }
.desktop {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 15% 20%,rgba(166,204,255,.34),transparent 38%),
    radial-gradient(ellipse at 80% 15%,rgba(255,198,224,.25),transparent 34%),
    radial-gradient(ellipse at 70% 80%,rgba(193,221,255,.30),transparent 42%);
}
.desktop::before,.desktop::after {
  content: "";
  position: absolute;
  width: 360px;
  height: 360px;
  border-radius: 50%;
  filter: blur(70px);
  opacity: .42;
  pointer-events: none;
  animation: drift 18s ease-in-out infinite alternate;
}
.desktop::before { background:#c4dcff; top:10%;left:25%; }
.desktop::after { background:#ffd7e8; right:8%;bottom:8%;animation-delay:-8s; }
@keyframes drift {
  from { transform:translate(-30px,-20px) scale(.9); }
  to { transform:translate(55px,35px) scale(1.15); }
}
.desktop-icons {
  position: absolute;
  z-index: 2;
  inset: 16px 12px 65px 12px;
  display: grid;
  grid-auto-flow: column;
  grid-template-rows: repeat(7, min-content);
  grid-template-columns: repeat(auto-fill, 88px);
  align-content: start;
  justify-content: start;
  gap: 10px 7px;
  pointer-events: none;
}
.desktop-icon {
  width: 82px;
  min-height: 88px;
  border: 1px solid transparent;
  border-radius: 15px;
  display: flex;
  align-items: center;
  flex-direction: column;
  justify-content: flex-start;
  gap: 7px;
  padding: 9px 4px 6px;
  background: transparent;
  color: #273047;
  pointer-events: auto;
  user-select: none;
  transition: background .18s,border .18s,transform .18s;
  animation: iconFloat 5s ease-in-out infinite;
}
.desktop-icon:nth-child(2n) { animation-delay:-1.7s; }
.desktop-icon:nth-child(3n) { animation-delay:-3s; }
@keyframes iconFloat {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-2px); }
}
.desktop-icon:hover {
  background:rgba(255,255,255,.62);
  border-color:rgba(95,139,220,.18);
}
.desktop-icon.selected {
  background:rgba(91,141,239,.15);
  border-color:rgba(91,141,239,.42);
}
.app-icon {
  width: 48px;
  height: 48px;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 27px;
  font-weight: 800;
  color: white;
  box-shadow:0 7px 16px rgba(25,40,70,.14);
  overflow: hidden;
  flex-shrink: 0;
}
.app-icon img {
  width:100%;
  height:100%;
  object-fit:cover;
}
.desktop-icon span:last-child {
  font-size: 11px;
  text-align: center;
  line-height: 1.25;
  max-width: 78px;
  text-shadow: 0 1px 3px white;
  overflow-wrap:anywhere;
}
.icon-browser { background:linear-gradient(145deg,#6aa7ff,#4c71df); }
.icon-game { background:linear-gradient(145deg,#a6e96f,#3aab68); }
.icon-tiktok { background:#111; }
.icon-soundcloud { background:linear-gradient(145deg,#ffb04c,#ff641d); }
.icon-spotify { background:#1ed760; color:#102d1a; }
.icon-wiki { background:linear-gradient(145deg,#fff,#e7eaf0);color:#333;border:1px solid #dfe3ec; }
.icon-mdn { background:linear-gradient(145deg,#3c3e56,#1d2034); }
.icon-youtube { background:#ff0033; }
.icon-google { background:#fff;border:1px solid #e6e8ee;color:#4285f4; }
.icon-discord { background:#5865f2; }
.icon-settings { background:linear-gradient(145deg,#9ca8ba,#68778f); }

.window {
  position: absolute;
  z-index: 5;
  top: 11%;
  left: 17%;
  width: min(900px,76vw);
  height: min(590px,76vh);
  min-width: 300px;
  min-height: 230px;
  background:rgba(255,255,255,.91);
  backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,.95);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
  display:none;
  flex-direction:column;
  animation:windowIn .22s ease-out;
}
@keyframes windowIn {
  from { opacity:0;transform:translateY(8px) scale(.985); }
  to { opacity:1;transform:translateY(0) scale(1); }
}
.window.active { display:flex; }
.window.maximized {
  top:8px!important;left:8px!important;
  width:calc(100vw - 16px)!important;
  height:calc(100vh - 70px)!important;
  border-radius:14px;
}
.titlebar {
  height:47px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 13px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.72);
  cursor:grab;
  user-select:none;
}
.titlebar:active { cursor:grabbing; }
.window-app-icon {
  width:27px;height:27px;
  display:flex;align-items:center;justify-content:center;
  border-radius:9px;font-size:17px;
}
.window-title { font-size:13px;font-weight:650;flex:1; }
.window-actions { display:flex;gap:7px; }
.win-btn {
  border:0;background:#eef1f7;color:#46516a;
  width:27px;height:27px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.win-btn:hover { background:#dfe7f5; }
.win-btn.close:hover { background:#ffe1e5;color:#d72f4c; }
.toolbar {
  display:flex;gap:8px;align-items:center;
  padding:9px 12px;
  border-bottom:1px solid var(--line);
  background:rgba(250,251,255,.9);
}
.tool-btn {
  border:1px solid var(--line);
  background:white;color:#47516a;
  border-radius:10px;padding:7px 11px;
}
.tool-btn:hover { background:#eef4ff; }
.address {
  flex:1;min-width:0;
  border:1px solid #e2e7f0;
  background:#f6f8fc;
  padding:9px 12px;border-radius:11px;
  outline:none;color:#364057;
}
.address:focus { border-color:#8db2ff;background:#fff; }
.go-btn {
  border:0;border-radius:10px;padding:9px 15px;
  color:#fff;background:var(--blue);font-weight:600;
}
.go-btn:hover { background:#4779df; }
.browser-content { flex:1;min-height:0;position:relative; }
.home-screen {
  position:absolute;inset:0;overflow:auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:25px;
  background:radial-gradient(ellipse at center,rgba(226,237,255,.55),transparent 65%);
}
.logo-mark {
  width:70px;height:70px;border-radius:24px;
  background:linear-gradient(145deg,#7bb6ff,#5675e8);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:37px;font-weight:800;
  box-shadow:0 12px 25px rgba(75,117,220,.24);
  margin-bottom:17px;
}
.home-screen h1 { margin:0;font-size:clamp(25px,4vw,36px);letter-spacing:-1px; }
.home-screen p { color:var(--muted);margin:9px 0 22px;font-size:14px; }
.home-search { display:flex;gap:8px;width:min(510px,100%); }
.home-search input {
  flex:1;min-width:0;border:1px solid #e0e6f0;background:#fff;
  border-radius:14px;padding:14px 16px;outline:none;
  box-shadow:0 6px 20px rgba(60,80,120,.06);
}
.home-search input:focus { border-color:#9bbcff; }
.home-shortcuts {
  display:flex;justify-content:center;flex-wrap:wrap;gap:12px;
  margin-top:25px;max-width:520px;
}
.shortcut {
  display:flex;flex-direction:column;align-items:center;gap:6px;
  border:1px solid transparent;background:transparent;border-radius:13px;
  padding:10px;width:75px;color:#5b6477;font-size:11px;
}
.shortcut:hover { background:rgba(255,255,255,.8);border-color:var(--line); }
.shortcut .app-icon { width:37px;height:37px;border-radius:12px;font-size:21px; }
.viewer { display:none;position:absolute;inset:0;background:#fff; }
.viewer iframe { width:100%;height:100%;border:0;background:#fff; }
.external-fallback {
  display:none;position:absolute;inset:0;overflow:auto;
  background:linear-gradient(145deg,#f8faff,#edf3ff);
  align-items:center;justify-content:center;text-align:center;padding:25px;
}
.external-fallback.show { display:flex; }
.fallback-card {
  max-width:430px;padding:28px;border-radius:22px;
  background:rgba(255,255,255,.85);border:1px solid white;
  box-shadow:0 12px 40px rgba(40,60,100,.1);
}
.fallback-card h2 { margin:12px 0 8px; }
.fallback-card p { color:var(--muted);font-size:13px;line-height:1.6; }
.fallback-actions { display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px; }
.settings-content { flex:1;overflow:auto;padding:22px;background:#f7f9fd; }
.settings-content h2 { margin:0 0 5px;font-size:23px; }
.settings-content .sub { color:var(--muted);font-size:13px;margin:0 0 20px; }
.settings-group {
  padding:16px;margin-bottom:12px;background:#fff;
  border:1px solid #e7ebf3;border-radius:15px;
}
.settings-group h3 { margin:0 0 12px;font-size:14px; }
.setting-row { display:flex;align-items:center;justify-content:space-between;gap:15px;padding:10px 0; }
.setting-row + .setting-row { border-top:1px solid #edf0f5; }
.setting-row strong { font-size:13px;display:block; }
.setting-row small { color:var(--muted);font-size:11px;display:block;margin-top:4px; }
.setting-row input[type="checkbox"] { width:18px;height:18px;accent-color:var(--blue); }
.setting-row select { padding:7px;border:1px solid #dfe5ef;border-radius:8px;background:white; }
.taskbar {
  position:absolute;z-index:100;bottom:0;left:0;right:0;height:54px;
  display:flex;align-items:center;gap:10px;padding:0 13px;
  background:rgba(255,255,255,.8);backdrop-filter:blur(24px);
  border-top:1px solid rgba(255,255,255,.9);
  box-shadow:0 -5px 22px rgba(50,65,95,.06);
}
.start-btn {
  width:38px;height:38px;border:0;border-radius:12px;
  background:linear-gradient(145deg,#74aaff,#577de6);
  color:white;font-size:20px;font-weight:800;
  box-shadow:0 5px 12px rgba(75,117,220,.2);
}
.start-btn:hover { transform:translateY(-1px); }
.task-apps { display:flex;align-items:center;gap:6px;flex:1;min-width:0; }
.task-app {
  border:0;background:transparent;border-radius:10px;
  width:37px;height:37px;display:flex;align-items:center;justify-content:center;
  font-size:20px;
}
.task-app:hover,.task-app.running { background:rgba(91,141,239,.13); }
.task-app.running::after {
  content:"";position:absolute;bottom:4px;width:15px;height:3px;
  border-radius:5px;background:#5b8def;
}
.clock { font-size:11px;color:#687187;text-align:right;line-height:1.5;white-space:nowrap; }
.start-menu {
  display:none;position:absolute;z-index:110;bottom:62px;left:12px;
  width:min(360px,calc(100vw - 24px));max-height:min(510px,75vh);
  overflow:auto;padding:17px;border:1px solid white;border-radius:20px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(24px);
  box-shadow:var(--shadow);animation:windowIn .18s ease-out;
}
.start-menu.show { display:block; }
.start-head { display:flex;align-items:center;gap:10px;margin-bottom:15px; }
.start-head .logo-mark { width:40px;height:40px;border-radius:13px;font-size:22px;margin:0; }
.start-head strong { font-size:15px; }
.start-head small { display:block;color:var(--muted);margin-top:3px; }
.start-search {
  width:100%;padding:11px 13px;border:1px solid #e2e7f0;
  border-radius:11px;outline:none;margin-bottom:15px;
}
.start-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:7px; }
.start-item {
  border:1px solid transparent;border-radius:12px;background:transparent;
  padding:12px 5px;display:flex;flex-direction:column;align-items:center;gap:7px;
  color:#3b465e;font-size:11px;
}
.start-item:hover { background:#f0f5ff;border-color:#e0eaff; }
.start-item .app-icon { width:38px;height:38px;border-radius:12px;font-size:21px; }
.start-foot { margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted); }
.empty-results { padding:20px;text-align:center;color:var(--muted);font-size:13px; }
@media(max-width:600px) {
  .desktop-icons { grid-template-rows:repeat(8,min-content);grid-template-columns:repeat(auto-fill,75px);gap:5px; }
  .desktop-icon { width:72px; }
  .app-icon { width:43px;height:43px; }
  .window { left:3%;top:7%;width:94vw;height:82vh;min-width:0; }
  .toolbar { gap:5px;padding:7px; }
  .tool-btn { padding:7px 8px; }
  .go-btn { padding:8px 10px; }
  .taskbar { padding:0 8px;gap:7px; }
}
</style>
</head>
<body>
<div class="desktop" id="desktop">
  <div class="desktop-icons" id="desktopIcons">
    <button class="desktop-icon" data-app="browser" title="Double-click to open">
      <span class="app-icon icon-browser">d</span><span>Browser</span>
    </button>
    <button class="desktop-icon" data-app="game" title="Double-click to open">
      <span class="app-icon icon-game">🎮</span><span>Geometry Dash</span>
    </button>
    <button class="desktop-icon" data-app="youtube" title="Double-click to open">
      <span class="app-icon icon-youtube">▶</span><span>YouTube</span>
    </button>
    <button class="desktop-icon" data-app="google" title="Double-click to open">
      <span class="app-icon icon-google">G</span><span>Google</span>
    </button>
    <button class="desktop-icon" data-app="discord" title="Double-click to open">
      <span class="app-icon icon-discord">🎮</span><span>Discord</span>
    </button>
    <button class="desktop-icon" data-app="settings" title="Double-click to open">
      <span class="app-icon icon-settings">⚙</span><span>Settings</span>
    </button>
    <button class="desktop-icon" data-app="tiktok" title="Double-click to open">
      <span class="app-icon icon-tiktok">♪</span><span>TikTok</span>
    </button>
    <button class="desktop-icon" data-app="soundcloud" title="Double-click to open">
      <span class="app-icon icon-soundcloud">☁</span><span>SoundCloud</span>
    </button>
    <button class="desktop-icon" data-app="spotify" title="Double-click to open">
      <span class="app-icon icon-spotify">●</span><span>Spotify</span>
    </button>
    <button class="desktop-icon" data-app="wikipedia" title="Double-click to open">
      <span class="app-icon icon-wiki">W</span><span>Wikipedia</span>
    </button>
    <button class="desktop-icon" data-app="mdn" title="Double-click to open">
      <span class="app-icon icon-mdn">MDN</span><span>MDN Docs</span>
    </button>
  </div>

  <!-- Main browser window -->
  <section class="window" id="browserWindow" data-window="browser">
    <div class="titlebar" data-drag>
      <span class="window-app-icon icon-browser">d</span>
      <span class="window-title">dilBrowser</span>
      <div class="window-actions">
        <button class="win-btn" onclick="minimizeWindow('browser')" title="Minimize">−</button>
        <button class="win-btn" onclick="maximizeWindow('browser')" title="Maximize">□</button>
        <button class="win-btn close" onclick="closeWindow('browser')" title="Close">×</button>
      </div>
    </div>
    <div class="toolbar">
      <button class="tool-btn" onclick="goBack()" title="Back">←</button>
      <button class="tool-btn" onclick="goForward()" title="Forward">→</button>
      <button class="tool-btn" onclick="reloadBrowser()" title="Reload">↻</button>
      <button class="tool-btn" onclick="goHome()" title="Home">⌂</button>
      <input class="address" id="address" placeholder="Search or enter a website address">
      <button class="go-btn" onclick="openAddress()">Go</button>
    </div>
    <div class="browser-content">
      <div class="home-screen" id="homeScreen">
        <div class="logo-mark">d</div>
        <h1>Welcome to dilBrowser</h1>
        <p>Your web, your way.</p>
        <div class="home-search">
          <input id="homeAddress" placeholder="Search Google or enter a website..." onkeydown="if(event.key==='Enter')openHomeAddress()">
          <button class="go-btn" onclick="openHomeAddress()">Search</button>
        </div>
        <div class="home-shortcuts">
          <button class="shortcut" onclick="launchApp('youtube')"><span class="app-icon icon-youtube">▶</span>YouTube</button>
          <button class="shortcut" onclick="launchApp('google')"><span class="app-icon icon-google">G</span>Google</button>
          <button class="shortcut" onclick="launchApp('discord')"><span class="app-icon icon-discord">🎮</span>Discord</button>
          <button class="shortcut" onclick="launchApp('game')"><span class="app-icon icon-game">🎮</span>Geometry Dash</button>
          <button class="shortcut" onclick="launchApp('settings')"><span class="app-icon icon-settings">⚙</span>Settings</button>
        </div>
      </div>
      <div class="viewer" id="browserViewer">
        <iframe id="browserFrame" title="Browser view" referrerpolicy="no-referrer"></iframe>
      </div>
      <div class="external-fallback" id="browserFallback">
        <div class="fallback-card">
          <div class="logo-mark">d</div>
          <h2>Page opened in the browser view</h2>
          <p>If the website does not display here, it may block embedded browsing. You can open it in a separate browser tab instead.</p>
          <div class="fallback-actions">
            <button class="go-btn" onclick="openCurrentExternally()">Open externally ↗</button>
            <button class="tool-btn" onclick="goHome()">Home</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Individual app windows are created here -->
  <div id="appWindows"></div>

  <!-- Start menu -->
  <div class="start-menu" id="startMenu">
    <div class="start-head">
      <div class="logo-mark">d</div>
      <div><strong>dilBrowser</strong><small>Your mini desktop</small></div>
    </div>
    <input class="start-search" id="startSearch" placeholder="Search apps..." oninput="filterStartApps(this.value)">
    <div class="start-grid" id="startGrid"></div>
    <div class="start-foot"><span>All apps</span><span>● Online desktop</span></div>
  </div>

  <!-- Taskbar -->
  <div class="taskbar">
    <button class="start-btn" onclick="toggleStartMenu()" title="Start">d</button>
    <div class="task-apps" id="taskApps"></div>
    <div class="clock"><div id="clockTime">--:--</div><div id="clockDate">---</div></div>
  </div>
</div>

<script>
const APPS = {
  browser: {
    name:"Browser", icon:"d", color:"icon-browser", url:null, builtIn:true
  },
  game: {
    name:"Geometry Dash", icon:"🎮", color:"icon-game",
    url:"https://truffled.lol/games/geo/index.html"
  },
  youtube: {
    name:"YouTube", icon:"▶", color:"icon-youtube",
    url:"https://www.youtube.com/"
  },
  google: {
    name:"Google", icon:"G", color:"icon-google",
    url:"https://www.google.com/"
  },
  discord: {
    name:"Discord", icon:"🎮", color:"icon-discord",
    url:"https://discord.com/app"
  },
  settings: {
    name:"Settings", icon:"⚙", color:"icon-settings", builtIn:true
  },
  tiktok: {
    name:"TikTok", icon:"♪", color:"icon-tiktok",
    url:"https://www.tiktok.com/"
  },
  soundcloud: {
    name:"SoundCloud", icon:"☁", color:"icon-soundcloud",
    url:"https://soundcloud.com/"
  },
  spotify: {
    name:"Spotify", icon:"●", color:"icon-spotify",
    url:"https://open.spotify.com/"
  },
  wikipedia: {
    name:"Wikipedia", icon:"W", color:"icon-wiki",
    url:"https://www.wikipedia.org/"
  },
  mdn: {
    name:"MDN Docs", icon:"MDN", color:"icon-mdn",
    url:"https://developer.mozilla.org/"
  }
};

const desktop = document.getElementById("desktop");
const appWindows = document.getElementById("appWindows");
const taskApps = document.getElementById("taskApps");
const startGrid = document.getElementById("startGrid");
const startMenu = document.getElementById("startMenu");
const browserWindow = document.getElementById("browserWindow");
const browserFrame = document.getElementById("browserFrame");
const browserViewer = document.getElementById("browserViewer");
const homeScreen = document.getElementById("homeScreen");
const browserFallback = document.getElementById("browserFallback");
let zIndex = 10;
let activeApp = null;
let browserHistory = [];
let browserHistoryIndex = -1;
let selectedIcon = null;
const openWindows = {};

function iconMarkup(app) {
  return `<span class="app-icon ${app.color}">${app.icon}</span>`;
}
function makeStartMenu() {
  startGrid.innerHTML = "";
  Object.entries(APPS).forEach(([id,app]) => {
    const button = document.createElement("button");
    button.className = "start-item";
    button.dataset.app = id;
    button.innerHTML = iconMarkup(app) + `<span>${app.name}</span>`;
    button.ondblclick = () => launchApp(id);
    button.onclick = () => launchApp(id);
    startGrid.appendChild(button);
  });
}
function makeTaskbar() {
  taskApps.innerHTML = "";
  Object.entries(APPS).forEach(([id,app]) => {
    const button = document.createElement("button");
    button.className = "task-app";
    button.title = app.name;
    button.innerHTML = app.icon;
    button.onclick = () => {
      if (id === "browser") {
        showWindow(browserWindow,"browser");
      } else if (openWindows[id] && openWindows[id].classList.contains("active")) {
        minimizeWindow(id);
      } else {
        launchApp(id);
      }
    };
    button.dataset.task = id;
    taskApps.appendChild(button);
  });
}
makeStartMenu();
makeTaskbar();

function toggleStartMenu() {
  startMenu.classList.toggle("show");
  if (startMenu.classList.contains("show")) {
    document.getElementById("startSearch").focus();
  }
}
function filterStartApps(query) {
  const q = query.toLowerCase().trim();
  let found = 0;
  [...startGrid.children].forEach(item => {
    const match = item.textContent.toLowerCase().includes(q);
    item.style.display = match ? "" : "none";
    if (match) found++;
  });
  let empty = startGrid.querySelector(".empty-results");
  if (!found && !empty) {
    empty = document.createElement("div");
    empty.className = "empty-results";
    empty.textContent = "No apps found";
    startGrid.appendChild(empty);
  } else if (found && empty) empty.remove();
}
function setTaskRunning(id, running) {
  const button = taskApps.querySelector(`[data-task="${id}"]`);
  if (button) button.classList.toggle("running",running);
}
function showWindow(win,id) {
  win.classList.add("active");
  win.style.zIndex = ++zIndex;
  activeApp = id;
  setTaskRunning(id,true);
  startMenu.classList.remove("show");
}
function closeWindow(id) {
  if (id === "browser") {
    browserWindow.classList.remove("active");
  } else if (openWindows[id]) {
    openWindows[id].classList.remove("active");
  }
  setTaskRunning(id,false);
  if (activeApp === id) activeApp = null;
}
function minimizeWindow(id) {
  if (id === "browser") browserWindow.classList.remove("active");
  else if (openWindows[id]) openWindows[id].classList.remove("active");
  if (activeApp === id) activeApp = null;
}
function maximizeWindow(id) {
  const win = id === "browser" ? browserWindow : openWindows[id];
  if (!win) return;
  win.classList.toggle("maximized");
  win.style.zIndex = ++zIndex;
}
function bringToFront(win,id) {
  win.style.zIndex = ++zIndex;
  activeApp = id;
}
function makeDraggable(win,id) {
  const bar = win.querySelector("[data-drag]");
  if (!bar) return;
  let dragging = false, startX=0, startY=0, originalX=0, originalY=0;
  bar.addEventListener("pointerdown", e => {
    if (e.target.closest("button")) return;
    if (win.classList.contains("maximized")) return;
    dragging = true;
    startX=e.clientX; startY=e.clientY;
    const rect=win.getBoundingClientRect();
    originalX=rect.left; originalY=rect.top;
    bar.setPointerCapture(e.pointerId);
    bringToFront(win,id);
  });
  bar.addEventListener("pointermove", e => {
    if (!dragging) return;
    const left=Math.max(0,Math.min(window.innerWidth-win.offsetWidth,originalX+e.clientX-startX));
    const top=Math.max(0,Math.min(window.innerHeight-80,originalY+e.clientY-startY));
    win.style.left=left+"px";
    win.style.top=top+"px";
  });
  bar.addEventListener("pointerup",()=>dragging=false);
  bar.addEventListener("pointercancel",()=>dragging=false);
}

function makeAppWindow(id) {
  const app=APPS[id];
  const win=document.createElement("section");
  win.className="window";
  win.id="window-"+id;
  win.dataset.window=id;
  win.style.left=(12+Object.keys(openWindows).length*22)%Math.max(1,window.innerWidth-340)+"px";
  win.style.top=(55+Object.keys(openWindows).length*18)%Math.max(1,window.innerHeight-240)+"px";
  win.innerHTML=`
    <div class="titlebar" data-drag>
      <span class="window-app-icon ${app.color}">${app.icon}</span>
      <span class="window-title">${app.name}</span>
      <div class="window-actions">
        <button class="win-btn" onclick="minimizeWindow('${id}')" title="Minimize">−</button>
        <button class="win-btn" onclick="maximizeWindow('${id}')" title="Maximize">□</button>
        <button class="win-btn close" onclick="closeWindow('${id}')" title="Close">×</button>
      </div>
    </div>
    ${id === "settings" ? settingsMarkup() : `
      <div class="toolbar">
        <button class="tool-btn" onclick="reloadApp('${id}')" title="Reload">↻</button>
        <input class="address" id="address-${id}" value="${app.url}" aria-label="App address">
        <button class="go-btn" onclick="navigateApp('${id}')">Go</button>
        <button class="tool-btn" onclick="openExternally('${id}')" title="Open in another tab">↗</button>
      </div>
      <div class="browser-content">
        <div class="viewer" style="display:block">
          <iframe id="frame-${id}" src="${app.url}" title="${app.name}" referrerpolicy="no-referrer" allow="fullscreen; autoplay; clipboard-read; clipboard-write" loading="eager"></iframe>
        </div>
        <div class="external-fallback" id="fallback-${id}">
          <div class="fallback-card">
            <div class="app-icon ${app.color}" style="margin:auto">${app.icon}</div>
            <h2>${app.name}</h2>
            <p>This website may prevent itself from loading inside dilBrowser. Try opening it in a separate browser tab.</p>
            <div class="fallback-actions">
              <button class="go-btn" onclick="openExternally('${id}')">Open externally ↗</button>
              <button class="tool-btn" onclick="reloadApp('${id}')">Try again</button>
            </div>
          </div>
        </div>
      </div>
    `}
  `;
  appWindows.appendChild(win);
  openWindows[id]=win;
  makeDraggable(win,id);
  win.addEventListener("pointerdown",()=>bringToFront(win,id));
  return win;
}

function settingsMarkup() {
  return `
    <div class="settings-content">
      <h2>Settings</h2>
      <p class="sub">Customize your dilBrowser desktop.</p>
      <div class="settings-group">
        <h3>Appearance</h3>
        <div class="setting-row">
          <div><strong>Animated background</strong><small>Show the soft floating color effects.</small></div>
          <input type="checkbox" checked onchange="toggleAnimation(this.checked)">
        </div>
        <div class="setting-row">
          <div><strong>Desktop icon movement</strong><small>Enable the subtle icon motion.</small></div>
          <input type="checkbox" checked onchange="toggleIconMovement(this.checked)">
        </div>
      </div>
      <div class="settings-group">
        <h3>Desktop</h3>
        <div class="setting-row">
          <div><strong>Open apps</strong><small>Double-click desktop icons to launch apps.</small></div>
          <span style="font-size:12px;color:#6f7c93">Enabled</span>
        </div>
        <div class="setting-row">
          <div><strong>Home page</strong><small>Return to your dilBrowser home screen.</small></div>
          <button class="tool-btn" onclick="goHome();showWindow(browserWindow,'browser')">Open home</button>
        </div>
      </div>
      <div class="settings-group">
        <h3>About</h3>
        <div class="setting-row">
          <div><strong>dilBrowser</strong><small>A mini desktop made for the web.</small></div>
          <span style="font-size:12px;color:#6f7c93">Web Edition</span>
        </div>
      </div>
    </div>`;
}
function toggleAnimation(enabled) {
  document.querySelector(".desktop").classList.toggle("no-animation",!enabled);
  document.querySelectorAll(".desktop::before,.desktop::after");
  const styleId="animation-toggle-style";
  let style=document.getElementById(styleId);
  if (!style) { style=document.createElement("style");style.id=styleId;document.head.appendChild(style); }
  style.textContent=enabled ? "" : ".desktop::before,.desktop::after{animation:none!important;}";
}
function toggleIconMovement(enabled) {
  document.querySelectorAll(".desktop-icon").forEach(el=>{
    el.style.animation=enabled ? "" : "none";
  });
}
function launchApp(id) {
  startMenu.classList.remove("show");
  if (id === "browser") {
    showWindow(browserWindow,"browser");
    return;
  }
  if (!openWindows[id]) makeAppWindow(id);
  const win=openWindows[id];
  if (id !== "settings") {
    const frame=win.querySelector("iframe");
    if (frame && !frame.src) frame.src=APPS[id].url;
  }
  showWindow(win,id);
  setTaskRunning(id,true);
}
function reloadApp(id) {
  const frame=document.getElementById("frame-"+id);
  if (frame) {
    const address=document.getElementById("address-"+id);
    frame.src=address ? address.value : APPS[id].url;
  }
  const fallback=document.getElementById("fallback-"+id);
  if (fallback) fallback.classList.remove("show");
}
function navigateApp(id) {
  const address=document.getElementById("address-"+id);
  if (!address) return;
  const url=normalizeUrl(address.value);
  address.value=url;
  const frame=document.getElementById("frame-"+id);
  if (frame) frame.src=url;
}
function openExternally(id) {
  const address=document.getElementById("address-"+id);
  const url=address ? normalizeUrl(address.value) : APPS[id].url;
  window.open(url,"_blank","noopener,noreferrer");
}
function normalizeUrl(value) {
  let url=(value||"").trim();
  if (!url) return "https://www.google.com/";
  if (/^https?:\/\//i.test(url)) return url;
  if (url.includes(".") && !url.includes(" ")) return "https://"+url;
  return "https://www.google.com/search?q="+encodeURIComponent(url);
}
function openAddress() {
  const input=document.getElementById("address");
  navigateBrowser(input.value);
}
function openHomeAddress() {
  navigateBrowser(document.getElementById("homeAddress").value);
}
function navigateBrowser(value) {
  const url=normalizeUrl(value);
  document.getElementById("address").value=url;
  document.getElementById("homeAddress").value=value;
  browserHistory=browserHistory.slice(0,browserHistoryIndex+1);
  browserHistory.push(url);
  browserHistoryIndex=browserHistory.length-1;
  browserFallback.classList.remove("show");
  homeScreen.style.display="none";
  browserViewer.style.display="block";
  browserFrame.src=url;
  showWindow(browserWindow,"browser");
}
function goBack() {
  if (browserHistoryIndex>0) {
    browserHistoryIndex--;
    loadBrowserHistory();
  } else goHome();
}
function goForward() {
  if (browserHistoryIndex<browserHistory.length-1) {
    browserHistoryIndex++;
    loadBrowserHistory();
  }
}
function loadBrowserHistory() {
  const url=browserHistory[browserHistoryIndex];
  document.getElementById("address").value=url;
  browserFrame.src=url;
  browserFallback.classList.remove("show");
  homeScreen.style.display="none";
  browserViewer.style.display="block";
}
function reloadBrowser() {
  if (browserHistoryIndex>=0) browserFrame.src=browserHistory[browserHistoryIndex];
  else browserFrame.src=browserFrame.src;
}
function goHome() {
  homeScreen.style.display="flex";
  browserViewer.style.display="none";
  browserFallback.classList.remove("show");
  document.getElementById("address").value="";
  browserFrame.src="about:blank";
}
function openCurrentExternally() {
  if (browserHistoryIndex>=0) window.open(browserHistory[browserHistoryIndex],"_blank","noopener,noreferrer");
}
document.getElementById("address").addEventListener("keydown",e=>{
  if(e.key==="Enter") openAddress();
});

/* Double-click desktop icons to open apps; single click only selects. */
document.querySelectorAll(".desktop-icon").forEach(icon=>{
  icon.addEventListener("click",e=>{
    e.stopPropagation();
    document.querySelectorAll(".desktop-icon").forEach(el=>el.classList.remove("selected"));
    icon.classList.add("selected");
    selectedIcon=icon;
  });
  icon.addEventListener("dblclick",e=>{
    e.preventDefault();
    launchApp(icon.dataset.app);
  });
});
desktop.addEventListener("click",e=>{
  if (!e.target.closest(".desktop-icon") && !e.target.closest(".window") &&
      !e.target.closest(".taskbar") && !e.target.closest(".start-menu")) {
    document.querySelectorAll(".desktop-icon").forEach(el=>el.classList.remove("selected"));
  }
});
document.addEventListener("click",e=>{
  if (!e.target.closest(".start-menu") && !e.target.closest(".start-btn")) {
    startMenu.classList.remove("show");
  }
});
browserWindow.addEventListener("pointerdown",()=>bringToFront(browserWindow,"browser"));
makeDraggable(browserWindow,"browser");

/* Clock */
function updateClock() {
  const now=new Date();
  document.getElementById("clockTime").textContent=now.toLocaleTimeString([],{
    hour:"numeric",minute:"2-digit"
  });
  document.getElementById("clockDate").textContent=now.toLocaleDateString([],{
    month:"short",day:"numeric"
  });
}
updateClock();
setInterval(updateClock,30000);
</script>
</body>
</html>
