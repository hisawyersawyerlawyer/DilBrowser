
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slhsProxty</title>
<style>
:root {
  --bg: #080d20;
  --panel: rgba(17, 25, 51, .94);
  --line: rgba(151, 180, 255, .17);
  --blue: #4285ff;
  --cyan: #31eaff;
  --purple: #a66bff;
  --text: #f4f7ff;
  --muted: #9ba9ce;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  color: var(--text);
  font-family: "Segoe UI", Arial, sans-serif;
  background:
    radial-gradient(ellipse at 16% 15%, #173e82 0%, transparent 40%),
    radial-gradient(ellipse at 85% 80%, #392065 0%, transparent 42%),
    linear-gradient(135deg, #060b19, #0b1530 55%, #080817);
}
button, input { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 2px;
}
.desktop {
  height: calc(100vh - 58px);
  position: relative;
  overflow: hidden;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size: 42px 42px;
}
.desktop::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 20%, #03071350 100%);
}
.desktop-icon {
  position: absolute;
  z-index: 1;
  width: 100px;
  min-height: 104px;
  padding: 10px 5px;
  border: 1px solid transparent;
  border-radius: 15px;
  text-align: center;
  font-size: 12px;
  color: #f5f7ff;
  text-shadow: 0 2px 7px #000;
  cursor: grab;
  user-select: none;
  touch-action: none;
}
.desktop-icon:hover {
  background: #ffffff10;
  border-color: #ffffff22;
  backdrop-filter: blur(8px);
}
.desktop-icon.dragging {
  cursor: grabbing;
  background: #5688ff25;

}
.symbol {

  height: 57px;
  margin: 0 auto 9px;
  display: flex;
  align-items: center;

  overflow: hidden;
  border: 1px solid #ffffff25;

}
.symbol img {
  width: 100%;
  height: 100%;

}
.tiktok { background: #111; }
.soundcloud { background: #ff5500; }
.spotify { background: #1ed760; }
.gd {
  background: linear-gradient(145deg,#21d7ff,#425cff 55%,#a64cff);

}
.gd img { padding: 2px; }
.info { color: #a8d8ff; }
.taskbar {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 58px;
  z-index: 20;
  display: flex;
  justify-content: center;

  gap: 8px;
  border-top: 1px solid #ffffff18;
  background: rgba(7, 12, 29, .84);
  backdrop-filter: blur(28px);
}
.taskbutton {
  height: 42px;
  min-width: 43px;
  padding: 0 12px;
  border: 1px solid transparent;
  border-radius: 12px;
  background: transparent;
  cursor: pointer;
  font-size: 20px;
  transition: background .15s, transform .15s;
}
.taskbutton:hover {
  background: #ffffff12;

}
.taskbutton:active { transform: scale(.94); }
.start-logo {
  color: var(--cyan);

}
.clock {
  position: absolute;
  right: 20px;
  color: #d8e1ff;
  text-align: right;
  font-size: 11px;
  line-height: 1.5;
}
.window {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 47%;
  transform: translate(-50%,-50%);
  width: min(1120px, 95vw);
  height: min(730px, 83vh);
  min-height: 300px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid #a4baff30;
  border-radius: 20px;
  background: var(--panel);
  box-shadow: 0 35px 120px #0009, 0 0 50px #315bff12;
  backdrop-filter: blur(30px);
}
.window.hidden { display: none; }
.window.maximized {
  inset: 0 0 58px 0;
  width: 100%;
  height: auto;
  transform: none;
  border-radius: 0;
}
.titlebar {
  height: 53px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 14px;

}
.brandmark {

}
.title {

.winbtn {

}
.winbtn:hover { background: #ffffff12; color: white; }

.toolbar {
  min-height: 61px;

.navbtn {

.address-wrap {

.go-btn {

.page {

.home {

.home-logo {

.start-head {

.start-head small { color: #8193bb; font-size: 10px; }
.startgrid {
  display: grid;

.startgrid button {

  display: flex;
  flex-direction: column;

  justify-content: center;

  background: #ffffff08;

}
.startgrid button:hover {

@media(max-width:600px) {

  }

  .toolbar { gap: 4px; padding: 7px; }
  .navbtn { width: 29px; height: 34px; }
  .go-btn { padding: 0 10px; }
  .address-wrap { padding: 0 8px; }
  .clock { display: none; }
  .links { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .home { padding: 20px 13px; }
  .desktop-icon { width: 88px; }
  .symbol { width: 50px; height: 50px; }
}
</style>
</head>
<body>
<div class="desktop" id="desktop">
  <div class="desktop-icon" data-x="18" data-y="18" onclick="showBrowser()">

  </div>
  <div class="desktop-icon" data-x="18" data-y="246" onclick="openApp('https://www.tiktok.com/')">
    <span class="symbol tiktok"><img src="https://cdn.simpleicons.org/tiktok/FFFFFF" alt="TikTok"></span>TikTok
  </div>
  <div class="desktop-icon" data-x="18" data-y="360" onclick="openApp('https://soundcloud.com/')">

  </div>

<div class="window" id="window">
  <div class="titlebar" id="titlebar">
    <span class="brandmark">D</span>
    <span class="title" id="windowtitle">dilBrowser</span>
    <button class="winbtn" onclick="minimize()" aria-label="Minimize">—</button>
    <button class="winbtn" onclick="maximize()" aria-label="Maximize">□</button>

  </div>

  <div class="toolbar">
    <button class="navbtn" onclick="goBack()" title="Back">←</button>
    <button class="navbtn" onclick="goForward()" title="Forward">→</button>

      </div>

      <div class="search">
        <input id="homesearch" placeholder="Search or enter a website..."
          onkeydown="if(event.key==='Enter')navigate(this.value)">

          <span class="app-name">TikTok</span>
        </button>
        <button class="app-card" onclick="openApp('https://soundcloud.com/')">
          <span class="app-icon" style="background:#ff5500">☁</span>
          <span class="app-name">SoundCloud</span>

        <button class="app-card" onclick="openApp('https://open.spotify.com/')">

    <button onclick="openApp('https://open.spotify.com/');hideStart()"><span class="start-icon">≋</span>Spotify</button>
    <button onclick="navigate('https://www.wikipedia.org/');hideStart()"><span class="start-icon">📚</span>Wikipedia</button>
    <button onclick="navigate('https://www.google.com/');hideStart()"><span class="start-icon">🔎</span>Google</button>

  <button class="taskbutton" onclick="goHome()" title="Home">⌂</button>
  <div class="clock" id="clock"></div>

<script>
const win = document.getElementById('window');
const home = document.getElementById('home');
const viewer = document.getElementById('viewer');
const address = document.getElementById('address');
const windowTitle = document.getElementById('windowtitle');

const geometryURL = 'https://truffled.lol/games/geo/index.html';
const truffledURL = 'https://truffled.lol/';

let historyList = [];
let historyIndex = -1;
let maximized = false;
let previousStyle = {};

function openApp(url) {
  window.open(url, '_blank', 'noopener,noreferrer');
}

function normalizeUrl(value) {
  value = value.trim();
  if (!value) return '';

  if (/\s/.test(value) || !value.includes('.')) {
    return 'https://www.google.com/search?q=' + encodeURIComponent(value);
  }

  if (!/^https?:\/\//i.test(value)) value = 'https://' + value;
  return value;
}

function navigate(value, addHistory = true, pageTitle = 'dilBrowser') {
  const url = normalizeUrl(value);
  if (!url) return;

  if (addHistory) {
    historyList = historyList.slice(0, historyIndex + 1);
    historyList.push({ url, title: pageTitle });
    historyIndex = historyList.length - 1;
  }

  address.value = url;
  document.getElementById('homesearch').value = value;
  home.hidden = true;
  viewer.hidden = false;
  viewer.src = url;
  windowTitle.textContent = pageTitle;
  showBrowser();
  hideStart();
}

function launchGeometryDash() {
  navigate(geometryURL, true, 'Geometry Dash');
}

function goBack() {
  if (historyIndex <= 0) return;
  historyIndex--;
  const item = historyList[historyIndex];
  navigate(item.url, false, item.title);
}

function goForward() {
  if (historyIndex >= historyList.length - 1) return;
  historyIndex++;
  const item = historyList[historyIndex];
  navigate(item.url, false, item.title);
}

function reloadPage() {
  if (!viewer.hidden && address.value) {
    viewer.src = address.value;
  } else {
    goHome();
  }
}

function goHome() {
  address.value = '';
  viewer.src = 'about:blank';
  viewer.hidden = true;
  home.hidden = false;
  windowTitle.textContent = 'dilBrowser';
  showBrowser();
  hideStart();
}

function showBrowser() {
  win.classList.remove('hidden');
}

function closeBrowser() {
  win.classList.add('hidden');
  hideStart();
}

function minimize() {
  win.classList.add('hidden');
}

function maximize() {
  if (!maximized) {
    previousStyle = {
      left: win.style.left,
      top: win.style.top,
      width: win.style.width,
      height: win.style.height,
      transform: win.style.transform
    };
    win.classList.add('maximized');
    win.style.left = '';
    win.style.top = '';
    win.style.width = '';
    win.style.height = '';
    win.style.transform = '';
    maximized = true;
  } else {
    win.classList.remove('maximized');
    Object.assign(win.style, previousStyle);
    maximized = false;
  }
}

function toggleStart() {
  document.getElementById('startmenu').classList.toggle('hidden');
}

function hideStart() {
  document.getElementById('startmenu').classList.add('hidden');
}

function about() {
  alert(
    'dilBrowser\n\n' +
    'A custom desktop-style web experience.\n\n' +
    'Geometry Dash loads inside the browser window. ' +
    'Some websites may block embedding, which this page cannot override.'
  );
}

function updateClock() {
  const now = new Date();
  document.getElementById('clock').innerHTML =
    now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) +
    '<br>' + now.toLocaleDateString();
}
updateClock();
setInterval(updateClock, 1000);

// Make desktop icons draggable.
const desktop = document.getElementById('desktop');
let draggedIcon = null;
let startX = 0, startY = 0, originX = 0, originY = 0, moved = false;

document.querySelectorAll('.desktop-icon').forEach(icon => {
  icon.style.left = (Number(icon.dataset.x) || 0) + 'px';
  icon.style.top = (Number(icon.dataset.y) || 0) + 'px';

  icon.addEventListener('pointerdown', event => {
    if (event.button !== 0) return;
    draggedIcon = icon;
    moved = false;
    startX = event.clientX;
    startY = event.clientY;
    originX = parseFloat(icon.style.left) || 0;
    originY = parseFloat(icon.style.top) || 0;
    icon.classList.add('dragging');
    icon.setPointerCapture(event.pointerId);
  });

  icon.addEventListener('pointermove', event => {
    if (draggedIcon !== icon) return;

    const dx = event.clientX - startX;
    const dy = event.clientY - startY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
    if (!moved) return;

    const maxX = Math.max(0, desktop.clientWidth - icon.offsetWidth);
    const maxY = Math.max(0, desktop.clientHeight - icon.offsetHeight);

    icon.style.left = Math.max(0, Math.min(maxX, originX + dx)) + 'px';
    icon.style.top = Math.max(0, Math.min(maxY, originY + dy)) + 'px';
  });

  function stopDragging() {
    if (draggedIcon !== icon) return;
    icon.classList.remove('dragging');
    draggedIcon = null;
  }

  icon.addEventListener('pointerup', stopDragging);
  icon.addEventListener('pointercancel', stopDragging);

  icon.addEventListener('click', event => {
    if (moved) {
      event.stopImmediatePropagation();
      event.preventDefault();
      moved = false;
    }
  }, true);
});

// Allow dragging the browser window by its title bar.
const titlebar = document.getElementById('titlebar');
let draggingWindow = false;
let offsetX = 0, offsetY = 0;

titlebar.addEventListener('pointerdown', event => {
  if (event.target.closest('button') || maximized) return;

  draggingWindow = true;
  const rect = win.getBoundingClientRect();
  offsetX = event.clientX - rect.left;
  offsetY = event.clientY - rect.top;
  titlebar.setPointerCapture(event.pointerId);
});

titlebar.addEventListener('pointermove', event => {
  if (!draggingWindow) return;
  win.style.left = (event.clientX - offsetX) + 'px';
  win.style.top = (event.clientY - offsetY) + 'px';
  win.style.transform = 'none';
});

titlebar.addEventListener('pointerup', () => draggingWindow = false);
titlebar.addEventListener('pointercancel', () => draggingWindow = false);
